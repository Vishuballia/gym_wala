<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhojpuri Gym Beats</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:#fff;font-family:Arial,Helvetica,sans-serif;
  width:100vw;height:100vh;overflow:hidden;background:#000;
}
.app{
  position:relative;width:100vw;height:100vh;background:#0a0a0a;overflow:hidden;
}
.hero{
  position:absolute;inset:0;width:100%;height:100%;background:#090909;
}
.poster{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;
}

/* mini gym-console player, mounted between the two guys and the girl */
.player{
  position:absolute;
  left:44%;
  top:60%;
  transform:translate(-50%,-50%);
  width:min(27%,158px);
  z-index:3;
  background:linear-gradient(155deg,rgba(15,15,15,.94),rgba(4,4,4,.94));
  border:1px solid #eab308;
  border-radius:9px;
  padding:5px 8px 4px;
  box-shadow:0 8px 22px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.03);
  backdrop-filter:blur(3px);
}
.title{
  text-align:center;color:#facc15;font-weight:900;font-size:9px;
  letter-spacing:.6px;margin-bottom:3px;line-height:1.1;
  text-shadow:0 0 8px rgba(250,204,21,.35);
  display:flex;align-items:center;justify-content:center;gap:3px;
}
.title .bar{width:10px;height:2px;background:#eab308;display:inline-block}
.now{
  min-height:0;border-bottom:1px solid #262626;padding:0 0 3px;
}
.label{font-size:5.5px;color:#8a8a8a;text-transform:uppercase;letter-spacing:1.2px}
.song{font-size:9px;font-weight:800;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.controls{display:flex;align-items:center;gap:5px;margin-top:4px}
button{
  border:0;background:transparent;color:#fff;font-size:10px;cursor:pointer;padding:0;line-height:1;
}
.play{
  width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe066,#eab308);color:#1a1400;
  font-size:9px;display:grid;place-items:center;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.progress{margin-top:4px}
input[type=range]{width:100%;accent-color:#facc15;cursor:pointer;height:8px}
.times{display:flex;justify-content:space-between;color:#999;font-size:5.5px;margin-top:0}
.volume{display:flex;align-items:center;gap:2px;margin-left:auto;font-size:7px}
.volume input{width:28px}
.playlist{margin-top:4px;max-height:38px;overflow:auto}
.playlist::-webkit-scrollbar{width:3px}
.playlist::-webkit-scrollbar-thumb{background:#3a3200;border-radius:3px}
.track{
  padding:2.5px 5px;border-radius:5px;display:flex;gap:5px;align-items:center;
  cursor:pointer;border:1px solid transparent;
}
.track:hover,.track.active{background:#171717;border-color:#5a4700}
.num{color:#facc15;width:11px;text-align:center;font-weight:bold;font-size:7px}
.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:7.5px}
.note{display:none}

.credit{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding:6px 14px;text-align:center;color:#bbb;font-size:9.5px;line-height:1.4;
  background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);
}
.credit b{color:#facc15}

@media (max-width:480px){
  .player{left:44%;top:60%;width:min(30%,148px);padding:4px 6px 3px}
  .title{font-size:8px}
  .song{font-size:8px}
}
</style>
</head>

<div id="ytplayer" style="position:absolute;width:1px;height:1px;left:-9999px;top:-9999px"></div>

<script>
const PLAYLIST_ID = "PLmq4sk5e9IoHjVAqqtktPCcKGZL9ISMIN";

let player, ready=false, tracks=[], index=0, pollTries=0;
const $=id=>document.getElementById(id);

function onYouTubeIframeAPIReady(){
  player = new YT.Player('ytplayer',{
    height:'1',width:'1',
    playerVars:{
      listType:'playlist',
      list:PLAYLIST_ID,
      controls:0,
      playsinline:1,
      rel:0
    },
    events:{
      onReady:onReady,
      onStateChange:onState,
      onError:onErr
    }
  });
}
function onReady(){
  ready=true;
  player.setVolume(80);
  pollForPlaylist();
}
function pollForPlaylist(){
  const list = player.getPlaylist ? player.getPlaylist() : null;
  if(list && list.length){
    tracks = list.map((id,i)=>({id,name:"Song "+(i+1)}));
    render();
    update();
    return;
  }
  pollTries++;
  if(pollTries < 30){
    setTimeout(pollForPlaylist, 500);
  } else {
    $('songName').textContent = "Playlist load nahi hui";
  }
}
function onErr(){
  if(ready) player.nextVideo();
}
function render(){
  const box=$('playlist');
  box.innerHTML='';
  tracks.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='track '+(i===index?'active':'');
    d.innerHTML=`<span class="num">${i+1}</span><span class="name">${escapeHtml(t.name)}</span>`;
    d.onclick=()=>select(i);
    box.appendChild(d);
  });
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function select(i){
  index=i;
  player.playVideoAt(index);
  update();
}
function update(){
  if(!ready)return;
  const i = player.getPlaylistIndex ? player.getPlaylistIndex() : -1;
  if(i>=0) index=i;
  const data = player.getVideoData ? player.getVideoData() : {};
  $('songName').textContent = (data && data.title) ? data.title : ("Song "+(index+1));
  document.querySelectorAll('.track').forEach((x,i)=>x.classList.toggle('active',i===index));
}
function onState(e){
  if(e.data===YT.PlayerState.PLAYING)$('play').textContent='⏸';
  else $('play').textContent='▶';
  update();
}
$('play').onclick=()=>{
  if(!ready)return;
  const s=player.getPlayerState();
  if(s===YT.PlayerState.PLAYING)player.pauseVideo();else player.playVideo();
};
$('prev').onclick=()=>ready&&player.previousVideo();
$('next').onclick=()=>ready&&player.nextVideo();
$('vol').oninput=e=>ready&&player.setVolume(Number(e.target.value)*100);
$('seek').oninput=e=>{
  if(ready){
    const d=player.getDuration();
    if(d)player.seekTo(d*Number(e.target.value)/100,true);
  }
};
setInterval(()=>{
  if(!ready)return;
  const d=player.getDuration(),c=player.getCurrentTime();
  if(d){
    $('seek').value=(c/d)*100;
    $('current').textContent=fmt(c);
    $('duration').textContent=fmt(d);
  }
  update();
},500);
function fmt(x){
  x=Math.floor(x||0);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
}
</script>
