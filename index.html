<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bhojpuri Gym Beats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Anton&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#facc15;
  --yellow-deep:#eab308;
  --frame-ratio: 1536 / 1024; /* poster's true aspect ratio */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  color:#fff;font-family:'Oswald',Arial,sans-serif;
  background:#000;
  width:100%;
  min-height:100dvh;
  overflow-x:hidden;
}

.app{
  position:relative;
  width:100%;
  height:100dvh; /* dynamic viewport height -> no mobile browser-chrome jump */
  min-height:100svh;
  background:#050505;
  overflow:hidden;
}

/* full-bleed blurred copy so there's never an empty/odd edge on any screen ratio */
.bg-blur{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;
  filter:blur(38px) brightness(.4) saturate(1.15);
  transform:scale(1.15);
}
.bg-tint{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%);
}

/* the frame always matches the poster's real aspect ratio, so anything
   positioned inside it (in %) lines up with the same spot on the image
   on every screen size -- this is what fixes the "shifts / wrong size"
   bug from before */
.frame{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  aspect-ratio: var(--frame-ratio);
  height:100%;
  max-width:100%;
  width:auto;
}
@media (max-aspect-ratio: 1536/1024){
  .frame{ width:100%; height:auto; }
}

.poster{
  display:block;width:100%;height:100%;object-fit:cover;
  filter:drop-shadow(0 20px 60px rgba(0,0,0,.6));
}

/* ================= PLAYER ================= */
.player{
  position:absolute;
  left:43.5%;
  top:57%;
  transform:translate(-50%,-50%);
  width:20%;
  min-width:150px;
  max-width:230px;
  z-index:3;
  background:linear-gradient(160deg,rgba(18,18,18,.92),rgba(4,4,4,.95));
  border:1px solid rgba(250,204,21,.55);
  border-radius:14px;
  padding:clamp(8px,1.1vw,14px);
  box-shadow:0 10px 30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04) inset;
  backdrop-filter:blur(6px);
  font-family:'Oswald',sans-serif;
}
.player-head{
  display:flex;align-items:center;justify-content:center;gap:5px;
  margin-bottom:6px;
}
.player-head .bar{width:12px;height:2px;background:var(--yellow-deep);display:inline-block;border-radius:2px}
.player-head span.txt{
  color:var(--yellow);font-weight:700;letter-spacing:1px;
  font-size:clamp(8px,.95vw,12px);text-shadow:0 0 10px rgba(250,204,21,.4);
  white-space:nowrap;
}

.now{border-bottom:1px solid #262626;padding-bottom:6px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.eq{display:flex;align-items:flex-end;gap:2px;height:12px;flex:0 0 auto}
.eq span{width:2.5px;background:var(--yellow);border-radius:2px;animation:eq 1s ease-in-out infinite;opacity:.85}
.eq span:nth-child(1){animation-delay:-0.9s;height:40%}
.eq span:nth-child(2){animation-delay:-0.4s;height:100%}
.eq span:nth-child(3){animation-delay:-0.6s;height:65%}
.eq span:nth-child(4){animation-delay:-0.2s;height:80%}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.now.paused .eq span{animation-play-state:paused;transform:scaleY(.3)}

.now-text{min-width:0;flex:1}
.label{font-size:clamp(6px,.6vw,8px);color:#9a9a9a;text-transform:uppercase;letter-spacing:1.3px}
.song{font-size:clamp(8px,1vw,12px);font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}

.progress{margin-top:2px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
  background:#2b2b2b;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;border-radius:50%;
  background:var(--yellow);box-shadow:0 0 6px rgba(250,204,21,.8);cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:10px;height:10px;border-radius:50%;background:var(--yellow);border:none;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:transparent}
.times{display:flex;justify-content:space-between;color:#999;font-size:clamp(6px,.6vw,8px);margin-top:2px}

.controls{display:flex;align-items:center;gap:6px;margin-top:6px}
button{border:0;background:transparent;color:#fff;cursor:pointer;padding:0;line-height:1}
.ctrl-btn{font-size:clamp(11px,1.3vw,15px);opacity:.9;transition:transform .15s,opacity .15s}
.ctrl-btn:hover{opacity:1;transform:scale(1.15)}
.play{
  width:clamp(22px,2.6vw,30px);height:clamp(22px,2.6vw,30px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe680,var(--yellow-deep));
  color:#1a1400;font-size:clamp(9px,1.1vw,13px);display:grid;place-items:center;
  font-weight:bold;box-shadow:0 3px 10px rgba(234,179,8,.5);
  transition:transform .15s;
}
.play:hover{transform:scale(1.08)}
.volume{display:flex;align-items:center;gap:3px;margin-left:auto;font-size:clamp(7px,.9vw,10px)}
.volume input{width:clamp(26px,3.2vw,40px)}

.playlist{margin-top:6px;max-height:70px;overflow-y:auto;padding-right:2px}
.playlist::-webkit-scrollbar{width:3px}
.playlist::-webkit-scrollbar-thumb{background:var(--yellow-deep);border-radius:3px}
.track{
  padding:3px 5px;border-radius:6px;display:flex;gap:6px;align-items:center;
  cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;
}
.track:hover{background:#171717}
.track.active{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.4)}
.num{color:var(--yellow);width:12px;text-align:center;font-weight:bold;font-size:clamp(6.5px,.7vw,9px);flex:0 0 auto}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(7px,.8vw,10px);color:#e8e8e8}
.track.active .name{color:var(--yellow)}

/* ================= CREDIT BAR ================= */
.credit{
  position:absolute;left:0;right:0;bottom:0;z-index:4;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  text-align:center;color:#ddd;
  font-size:clamp(9px,1.4vw,13px);line-height:1.4;
  background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
  letter-spacing:.3px;
}
.credit b{color:var(--yellow)}

@media (max-width:480px){
  .player{left:44%;top:56%;width:32%;min-width:118px}
  .playlist{max-height:56px}
}
</style>
</head>
<body>
<div class="app">
  <img class="bg-blur" src="gym_clean_jpeg.png" alt="" aria-hidden="true">
  <div class="bg-tint"></div>

  <div class="frame">
    <img class="poster" src="gym_clean_jpeg.png" alt="Bhojpuri Gym Beats">

    <div class="player">
      <div class="player-head"><span class="bar"></span><span class="txt">GYM BEATS</span><span class="bar"></span></div>

      <div class="now" id="nowRow">
        <div class="eq"><span></span><span></span><span></span><span></span></div>
        <div class="now-text">
          <div class="label">Now Playing</div>
          <div class="song" id="songName">Loading...</div>
        </div>
      </div>

      <div class="progress">
        <input id="seek" type="range" min="0" max="100" value="0">
        <div class="times"><span id="current">00:00</span><span id="duration">00:00</span></div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prev" title="Previous">⏮</button>
        <button id="play" class="play" title="Play/Pause">▶</button>
        <button class="ctrl-btn" id="next" title="Next">⏭</button>
        <div class="volume">🔊<input id="vol" type="range" min="0" max="1" step=".01" value=".8"></div>
      </div>

      <div class="playlist" id="playlist"></div>
    </div>
  </div>

  <div class="credit">
    🎧 Playlist seedhe YouTube se stream hoti hai — <b>play</b> dabao aur gym shuru karo.
  </div>
</div>

<div id="ytplayer" style="position:absolute;width:1px;height:1px;left:-9999px;top:-9999px"></div>

<script>
const PLAYLIST_ID = "PLmq4sk5e9IoHjVAqqtktPCcKGZL9ISMIN";

let player, ready=false, tracks=[], index=0, pollTries=0;
const $=id=>document.getElementById(id);
const titleCache = new Map();

function onYouTubeIframeAPIReady(){
  player = new YT.Player('ytplayer',{
    height:'1',width:'1',
    playerVars:{
      listType:'playlist',
      list:PLAYLIST_ID,
      controls:0,
      playsinline:1,
      rel:0
    },
    events:{
      onReady:onReady,
      onStateChange:onState,
      onError:onErr
    }
  });
}
function onReady(){
  ready=true;
  player.setVolume(80);
  pollForPlaylist();
}
function pollForPlaylist(){
  const list = player.getPlaylist ? player.getPlaylist() : null;
  if(list && list.length){
    tracks = list.map((id,i)=>({id,name:"Track "+(i+1)}));
    render();
    update();
    fetchRealTitles();
    return;
  }
  pollTries++;
  if(pollTries < 30){
    setTimeout(pollForPlaylist, 500);
  } else {
    $('songName').textContent = "Playlist load nahi hui";
  }
}

// pulls the real video titles via YouTube's public oEmbed endpoint
// (no API key needed) so the playlist shows actual song names.
async function fetchRealTitles(){
  await Promise.all(tracks.map(async (t, i)=>{
    if(titleCache.has(t.id)){
      tracks[i].name = titleCache.get(t.id);
      return;
    }
    try{
      const url = "https://www.youtube.com/oembed?format=json&url=" +
        encodeURIComponent("https://www.youtube.com/watch?v=" + t.id);
      const res = await fetch(url);
      if(res.ok){
        const data = await res.json();
        if(data && data.title){
          titleCache.set(t.id, data.title);
          tracks[i].name = data.title;
        }
      }
    }catch(e){ /* keep fallback "Track N" name */ }
  }));
  render();
  update();
}

function render(){
  const box=$('playlist');
  box.innerHTML='';
  tracks.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='track '+(i===index?'active':'');
    d.innerHTML=`<span class="num">${i+1}</span><span class="name">${escapeHtml(t.name)}</span>`;
    d.onclick=()=>select(i);
    box.appendChild(d);
  });
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function select(i){
  index=i;
  player.playVideoAt(index);
  update();
}
function update(){
  if(!ready)return;
  const i = player.getPlaylistIndex ? player.getPlaylistIndex() : -1;
  if(i>=0) index=i;
  const cached = tracks[index] ? tracks[index].name : null;
  const data = player.getVideoData ? player.getVideoData() : {};
  $('songName').textContent = cached || (data && data.title) || ("Track "+(index+1));
  document.querySelectorAll('.track').forEach((x,i)=>x.classList.toggle('active',i===index));
}
function onState(e){
  const playing = e.data===YT.PlayerState.PLAYING;
  $('play').textContent = playing ? '⏸' : '▶';
  $('nowRow').classList.toggle('paused', !playing);
  update();
}
function onErr(){
  if(ready) player.nextVideo();
}
$('play').onclick=()=>{
  if(!ready)return;
  const s=player.getPlayerState();
  if(s===YT.PlayerState.PLAYING)player.pauseVideo();else player.playVideo();
};
$('prev').onclick=()=>ready&&player.previousVideo();
$('next').onclick=()=>ready&&player.nextVideo();
$('vol').oninput=e=>ready&&player.setVolume(Number(e.target.value)*100);
$('seek').oninput=e=>{
  if(ready){
    const d=player.getDuration();
    if(d)player.seekTo(d*Number(e.target.value)/100,true);
  }
};
setInterval(()=>{
  if(!ready)return;
  const d=player.getDuration(),c=player.getCurrentTime();
  if(d){
    $('seek').value=(c/d)*100;
    $('current').textContent=fmt(c);
    $('duration').textContent=fmt(d);
  }
  update();
},500);
function fmt(x){
  x=Math.floor(x||0);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
